name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [23]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@v5.1.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v4.3.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Cache TypeScript build info
        uses: actions/cache@v4.3.0
        with:
          path: |
            tsconfig.tsbuildinfo
            .tsc-cache
          key: ${{ runner.os }}-tsc-${{ hashFiles('**/tsconfig.json', 'src/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-tsc-

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Cache ESLint
        uses: actions/cache@v4.3.0
        with:
          path: .eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('**/eslint.config.ts', 'src/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-eslint-

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Cache Vitest
        uses: actions/cache@v4.3.0
        with:
          path: |
            .vitest-cache
            node_modules/.vite
          key: ${{ runner.os }}-vitest-${{ hashFiles('**/vitest.config.ts', 'src/**/*.test.ts') }}
          restore-keys: |
            ${{ runner.os }}-vitest-

      - name: Run tests
        run: npm test

  windows-build-and-launch:
    # Same runner as the release build: the windows-latest image ships Visual
    # Studio 18, which node-gyp cannot use to rebuild uiohook-napi
    runs-on: windows-2022

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: '23'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package Electron app
        run: npx electron-builder --win --x64 --publish never
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: Launch packaged app
        run: ./scripts/smoke-test.ps1 -Exe dist/win-unpacked/Honyo.exe -TimeoutSec 90
        shell: pwsh

      - name: Upload installer
        uses: actions/upload-artifact@v4.6.2
        with:
          name: windows-x64-installer
          path: dist/*.exe
          retention-days: 7
