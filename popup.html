<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Translation</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        background: transparent;
        user-select: none;
      }

      /* Light mode (default) */
      :root {
        --bg-primary: white;
        --bg-secondary: #f7f7f7;
        --border-color: #e0e0e0;
        --text-primary: #333;
        --text-secondary: #666;
        --btn-primary: #007aff;
        --btn-primary-hover: #0056b3;
        --btn-primary-active: #004494;
        --close-btn: #ff5f57;
        --scrollbar-thumb: #ddd;
        --scrollbar-thumb-hover: #bbb;
        --shadow: rgba(0, 0, 0, 0.15);
      }

      /* Dark mode */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-primary: #1e1e1e;
          --bg-secondary: #2a2a2a;
          --border-color: #3a3a3a;
          --text-primary: #f0f0f0;
          --text-secondary: #b0b0b0;
          --btn-primary: #0a84ff;
          --btn-primary-hover: #0066cc;
          --btn-primary-active: #0051a3;
          --close-btn: #ff5f57;
          --scrollbar-thumb: #4a4a4a;
          --scrollbar-thumb-hover: #5a5a5a;
          --shadow: rgba(0, 0, 0, 0.4);
        }
      }
      .popup-container {
        background: var(--bg-primary);
        border-radius: 8px;
        box-shadow: 0 4px 24px var(--shadow);
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }
      .header {
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border-color);
        padding: 8px 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        -webkit-app-region: drag;
      }
      .header-title {
        font-size: 12px;
        color: var(--text-secondary);
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .header-icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .header-buttons {
        display: flex;
        align-items: center;
        gap: 8px;
        -webkit-app-region: no-drag;
      }
      .header-btn {
        padding: 4px 12px;
        font-size: 11px;
        border-radius: 3px;
        cursor: pointer;
      }
      .close-btn {
        background: none;
        border: none;
        cursor: pointer;
        -webkit-app-region: no-drag;
        font-size: 16px;
        line-height: 1;
        color: var(--text-secondary);
        padding: 4px 8px;
        margin: -4px -4px -4px 0;
        transition: color 0.2s;
      }
      .close-btn:hover {
        color: var(--text-primary);
      }
      .content {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
        user-select: text;
      }
      .translation-text {
        font-size: 14px;
        line-height: 1.6;
        color: var(--text-primary);
        word-wrap: break-word;
        white-space: pre-wrap;
      }
      .copy-btn {
        background: var(--btn-primary);
        color: white;
        border: 1px solid transparent;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
        transition: background-color 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      /* Button icons (share the header-icon stroke style) */
      .btn-icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        pointer-events: none;
      }
      .copy-btn .btn-icon {
        width: 14px;
        height: 14px;
      }
      .copy-btn:hover {
        background: var(--btn-primary-hover);
      }
      .copy-btn:active {
        background: var(--btn-primary-active);
      }
      .copy-btn:disabled {
        background: var(--border-color);
        cursor: not-allowed;
        opacity: 0.6;
      }
      .back-btn {
        background: var(--bg-primary);
        color: var(--text-secondary);
        border: 1px solid var(--border-color);
        padding: 6px 12px;
        border-radius: 4px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition:
          color 0.2s,
          background-color 0.2s;
      }
      .back-btn:hover:not(:disabled) {
        color: var(--text-primary);
        background: var(--bg-secondary);
      }
      .back-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      /* Active (pressed) state while showing the back-translation view */
      .back-btn.active {
        background: var(--btn-primary);
        color: #fff;
        border-color: var(--btn-primary);
      }
      .back-btn.active:hover:not(:disabled) {
        background: var(--btn-primary-hover);
        color: #fff;
      }
      /* Loading pulse while a back-translation request is in flight */
      .back-btn.loading .btn-icon {
        animation: back-pulse 0.9s ease-in-out infinite;
      }
      @keyframes back-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      /* Caption below the header — used only for back-translation error
         messages (muted italic). Hidden otherwise. Fixed small size, never
         scaled by the font-size setting (which only targets .translation-text). */
      .back-caption {
        font-size: 11px;
        color: var(--text-secondary);
        margin-bottom: 8px;
      }
      .back-caption.error {
        font-style: italic;
      }
      /* Custom scrollbar */
      .content::-webkit-scrollbar {
        width: 6px;
      }
      .content::-webkit-scrollbar-track {
        background: transparent;
      }
      .content::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 3px;
      }
      .content::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover);
      }

      /* Loading spinner */
      .spinner-container {
        display: none;
        justify-content: center;
        align-items: center;
        height: 100%;
      }
      .spinner-container.active {
        display: flex;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--border-color);
        border-top-color: var(--btn-primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="popup-container">
      <div class="header">
        <span class="header-title">
          <svg class="header-icon" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M3 3v10m10-10v10M3 8h10"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              fill="none"
            />
          </svg>
          <span id="header-title-text">Honyo Translator</span>
        </span>
        <div class="header-buttons">
          <button
            class="back-btn header-btn"
            id="back-btn"
            title="Back-translate"
            aria-label="Back-translate"
            disabled
          >
            <svg
              class="btn-icon"
              viewBox="0 0 16 16"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M3 6h10M10.5 3.5 13 6l-2.5 2.5M13 10H3M5.5 7.5 3 10l2.5 2.5"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                fill="none"
              />
            </svg>
          </button>
          <button class="copy-btn header-btn">
            <svg
              class="btn-icon"
              viewBox="0 0 16 16"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <rect
                x="6"
                y="6"
                width="7.5"
                height="8"
                rx="1.5"
                stroke="currentColor"
                stroke-width="1.5"
                fill="none"
              />
              <path
                d="M10 3.5H4.5A1.5 1.5 0 0 0 3 5v6"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                fill="none"
              />
            </svg>
            Copy
          </button>
          <button class="close-btn">×</button>
        </div>
      </div>
      <div class="content">
        <div class="spinner-container" id="spinner-container">
          <div class="spinner"></div>
        </div>
        <div class="back-caption" id="back-caption" style="display: none"></div>
        <div class="translation-text" id="translation-text" style="display: none"></div>
      </div>
    </div>

    <script src="build/renderer/popup.js"></script>
  </body>
</html>
