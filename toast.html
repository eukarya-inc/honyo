<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Honyo</title>
    <style>
      :root {
        --bg: rgba(255, 255, 255, 0.96);
        --border: rgba(0, 0, 0, 0.1);
        --title: #1d1d1f;
        --body: #48484a;
        --shadow: rgba(0, 0, 0, 0.18);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: rgba(40, 40, 42, 0.96);
          --border: rgba(255, 255, 255, 0.12);
          --title: #f5f5f7;
          --body: #c7c7cc;
          --shadow: rgba(0, 0, 0, 0.5);
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        cursor: default;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .toast {
        position: absolute;
        inset: 6px;
        display: flex;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--bg);
        border: 1px solid var(--border);
        box-shadow: 0 4px 14px var(--shadow);
      }
      .icon {
        flex: none;
        width: 18px;
        height: 18px;
        margin-top: 1px;
        color: var(--title);
      }
      .text {
        min-width: 0;
      }
      .title {
        font-size: 13px;
        font-weight: 600;
        color: var(--title);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .body {
        margin-top: 2px;
        font-size: 12px;
        line-height: 1.4;
        color: var(--body);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div class="toast" id="toast" title="Click to dismiss">
      <svg class="icon" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path
          d="M3 3v10m10-10v10M3 8h10"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          fill="none"
        />
      </svg>
      <div class="text">
        <div class="title" id="title"></div>
        <div class="body" id="body"></div>
      </div>
    </div>
    <script src="build/renderer/toast.js"></script>
  </body>
</html>
