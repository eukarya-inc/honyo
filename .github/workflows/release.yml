name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Keep building the other platforms when one fails
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          # Pinned to windows-2022: the windows-latest image ships Visual
          # Studio 18, which node-gyp cannot use to rebuild uiohook-napi
          - os: windows-2022
            arch: x64
          - os: ubuntu-latest
            arch: x64

    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: '23'

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxtst-dev libxt-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npm run typecheck

    - name: Build
      run: npm run build

    - name: Package Electron app
      run: ./node_modules/.bin/electron-builder --${{ matrix.arch }} --publish never
      env:
        ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ matrix.os }}-${{ matrix.arch }}-build
        path: |
          dist/*
          !dist/builder-debug.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        fetch-depth: 0  # Fetch all history for changelog generation

    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: '23'

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Generate changelog
      run: |
        # Get the current tag and previous tag
        CURRENT_TAG=${GITHUB_REF#refs/tags/}
        PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -A1 "^${CURRENT_TAG}$" | tail -n1)

        # Generate changelog between tags
        if [ -n "$PREVIOUS_TAG" ]; then
          npx conventional-changelog -p angular --release-count 0 ${PREVIOUS_TAG}..${CURRENT_TAG} 2>/dev/null | awk -v tag="$CURRENT_TAG" '
            /^## / {
              if (found) exit
              if ($0 ~ tag) { found=1; print; next }
            }
            /^# / {
              if (found) exit
              if ($0 ~ tag) { found=1; print; next }
            }
            found { print }
          ' > RELEASE_NOTES.md
        else
          npx conventional-changelog -p angular --release-count 1 > RELEASE_NOTES.md
        fi

    - name: Download all artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4

    - name: Remove duplicate and unwanted files
      run: |
        find . -name "builder-debug.yml" -type f -delete
        # Remove duplicate latest-*.yml files (keep only one of each)
        # Keep the first occurrence and remove duplicates from other arch builds
        if [ -f "macos-latest-x64-build/latest-mac.yml" ] && [ -f "macos-latest-arm64-build/latest-mac.yml" ]; then
          rm "macos-latest-arm64-build/latest-mac.yml"
        fi

    - name: Create Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        files: |
          macos-latest-x64-build/*
          macos-latest-arm64-build/*
          windows-2022-x64-build/*
          ubuntu-latest-x64-build/*
        draft: false
        prerelease: false
        fail_on_unmatched_files: false
        body_path: RELEASE_NOTES.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest

    steps:
    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
      with:
        app-id: ${{ vars.GH_APP_ID }}
        private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
        owner: eukarya-inc
        repositories: homebrew-tap

    - name: Download macOS x64 artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: macos-latest-x64-build
        path: artifacts/x64

    - name: Download macOS arm64 artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: macos-latest-arm64-build
        path: artifacts/arm64

    - name: Generate Homebrew cask
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        VERSION=${TAG#v}

        SHA_X64=$(sha256sum "artifacts/x64/Honyo-${VERSION}.dmg" | awk '{print $1}')
        SHA_ARM=$(sha256sum "artifacts/arm64/Honyo-${VERSION}-arm64.dmg" | awk '{print $1}')

        cat > honyo.rb <<CASK
        cask "honyo" do
          version "${VERSION}"

          on_intel do
            url "https://github.com/eukarya-inc/honyo/releases/download/v#{version}/Honyo-#{version}.dmg"
            sha256 "${SHA_X64}"
          end
          on_arm do
            url "https://github.com/eukarya-inc/honyo/releases/download/v#{version}/Honyo-#{version}-arm64.dmg"
            sha256 "${SHA_ARM}"
          end

          name "Honyo"
          desc "AI-powered instant translation with double Ctrl/Cmd+C"
          homepage "https://github.com/eukarya-inc/honyo"

          auto_updates true
          app "Honyo.app"

          zap trash: [
            "~/Library/Application Support/honyo",
            "~/Library/Preferences/com.rot1024.honyo.plist",
          ]
        end
        CASK

        cat honyo.rb

    - name: Push to Homebrew tap
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        git clone "https://x-access-token:${GH_TOKEN}@github.com/eukarya-inc/homebrew-tap.git" tap
        mkdir -p tap/Casks
        cp honyo.rb tap/Casks/honyo.rb
        cd tap
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        TAG=${GITHUB_REF#refs/tags/}
        git add Casks/honyo.rb
        git diff --cached --quiet || {
          git commit -m "Update honyo cask to ${TAG}"
          git push
        }
